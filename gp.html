<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030a2b">
<title>Gauntlet GP</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e8c66a'/%3E%3Ctext x='16' y='21' font-size='13' font-family='Arial' font-weight='900' text-anchor='middle' fill='%23030a2b'%3EGP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#030a2b; --deep:#06124a; --card:#0f2170; --card2:#0b1a5c; --line:rgba(170,190,255,.2);
  --silver:#dfe6f5; --muted:#8f9cc7; --cyan:#3ad6ff; --gold:#e8c66a; --red:#ff5d6c; --green:#4ade80;
  --display:'Barlow Condensed','Arial Narrow',sans-serif; --body:'Barlow','Segoe UI',system-ui,sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--silver);font-family:var(--body);font-size:16px;-webkit-text-size-adjust:100%}
body{background:radial-gradient(120% 60% at 50% -10%,#1638b8 0%,#06124a 45%,#030a2b 80%) fixed;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--cyan)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:20;background:rgba(3,10,43,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:58px}
.brand{font-family:var(--display);font-weight:800;letter-spacing:.16em;font-size:18px;color:#fff;text-decoration:none;white-space:nowrap}
.brand small{display:block;font-size:10px;letter-spacing:.3em;color:var(--muted);font-weight:700;margin-top:-2px}
.bal{margin-left:auto;flex:none;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:linear-gradient(180deg,#f3d98b,#c99a2e);color:#1c1403;font-weight:800;font-family:var(--display);font-size:20px;letter-spacing:.02em;box-shadow:0 0 0 1px rgba(255,255,255,.25) inset,0 4px 16px rgba(232,198,106,.25)}
.bal .coin{width:26px;height:26px;border-radius:50%;background:#1c1403;color:var(--gold);display:grid;place-items:center;font-size:11px;letter-spacing:0}
.mclink{font-family:var(--display);font-weight:700;letter-spacing:.12em;font-size:13px;color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:6px 10px;border-radius:8px;white-space:nowrap}
h1,h2,h3{font-family:var(--display);letter-spacing:.06em;margin:0;color:#fff}
h2{font-size:22px;margin:22px 0 10px;font-weight:800}
.kick{font-family:var(--display);font-weight:700;letter-spacing:.22em;font-size:12px;color:var(--muted);text-transform:uppercase}
.card{background:linear-gradient(180deg,rgba(20,40,140,.55),rgba(11,26,92,.7));border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}
.muted{color:var(--muted)} .small{font-size:13px} .gold{color:var(--gold)} .cyan{color:var(--cyan)} .red{color:var(--red)} .green{color:var(--green)}
.row{display:flex;align-items:center;gap:10px}
.face{border-radius:50%;object-fit:cover;background:#0b1a5c;border:2px solid rgba(223,230,245,.7);flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.04em;background:rgba(58,214,255,.12);color:var(--cyan);border:1px solid rgba(58,214,255,.35);white-space:nowrap}
.pill.gold{background:rgba(232,198,106,.12);color:var(--gold);border-color:rgba(232,198,106,.4)}
.pill.red{background:rgba(255,93,108,.12);color:var(--red);border-color:rgba(255,93,108,.4)}
.pill.green{background:rgba(74,222,128,.12);color:var(--green);border-color:rgba(74,222,128,.4)}
.pill.dim{background:rgba(143,156,199,.1);color:var(--muted);border-color:var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:0;background:var(--silver);color:var(--night);font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.1em;text-transform:uppercase}
.btn.gold{background:linear-gradient(180deg,#f3d98b,#c99a2e);color:#1c1403}
.btn.ghost{background:transparent;color:var(--silver);border:1px solid var(--line)}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{min-height:36px;font-size:14px;padding:0 12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px;font-weight:600}
input.in,select.in,textarea.in{width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(3,10,43,.6);font-size:16px}
textarea.in{min-height:80px;resize:vertical}
input.in:focus,select.in:focus,textarea.in:focus{outline:2px solid var(--cyan);outline-offset:1px}
.err{color:var(--red);font-size:14px;margin-top:10px;min-height:1em}
/* match cards */
.mcard{display:block;width:100%;text-align:left;border:1px solid var(--line);background:linear-gradient(180deg,rgba(20,40,140,.55),rgba(11,26,92,.7));border-radius:16px;padding:12px 14px;margin:0 0 10px}
.mtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.side{display:flex;align-items:center;gap:10px;min-width:0}
.side.r{flex-direction:row-reverse;text-align:right}
.side .nm{font-family:var(--display);font-weight:800;font-size:18px;color:#fff;line-height:1.05;letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis}
.side .od{font-size:13px;color:var(--muted)}
.side .od b{color:var(--cyan);font-size:15px}
.vsx{font-family:var(--display);font-weight:800;color:var(--red);font-size:18px}
.mfoot{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(3,10,43,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .wrap{display:flex;padding:0}
.tab{flex:1;background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;min-height:60px}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--gold)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(1,4,20,.72);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:linear-gradient(180deg,#0f2170,#06124a);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:20px}}
.sheet .x{float:right;background:none;border:1px solid var(--line);border-radius:10px;width:40px;height:40px;color:var(--silver);font-size:20px}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.opt{border:2px solid var(--line);background:rgba(3,10,43,.5);border-radius:14px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--silver);text-align:center}
.opt.on{border-color:var(--gold);background:rgba(232,198,106,.12);box-shadow:0 0 0 3px rgba(232,198,106,.15)}
.opt .nm{font-family:var(--display);font-weight:800;font-size:17px;color:#fff}
.opt[disabled]{opacity:.4}
.pw{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;border:2px solid var(--line);background:rgba(3,10,43,.5);border-radius:14px;padding:12px;margin-top:8px;color:var(--silver)}
.pw.on{border-color:var(--cyan);background:rgba(58,214,255,.08)}
.pw .t{font-family:var(--display);font-weight:800;font-size:17px;color:#fff;letter-spacing:.04em}
.pw .d{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.35}
.pw .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:rgba(58,214,255,.14);color:var(--cyan);font-weight:900}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:rgba(3,10,43,.5);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:700;color:var(--silver);min-height:36px}
.chip.on{border-color:var(--gold);color:var(--gold)}
.calc{margin-top:14px;border-radius:14px;padding:12px;background:rgba(3,10,43,.65);border:1px dashed rgba(232,198,106,.45)}
.calc .big{font-family:var(--display);font-weight:800;font-size:30px;color:var(--gold);letter-spacing:.02em}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0}
.kv span:first-child{color:var(--muted)}
/* lists */
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{font-weight:700;color:#fff}
.li .s{font-size:13px;color:var(--muted)}
.li .amt{margin-left:auto;text-align:right;font-family:var(--display);font-weight:800;font-size:18px;white-space:nowrap}
.seg{display:flex;background:rgba(3,10,43,.6);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin:6px 0 12px}
.seg button{flex:1;border:0;background:none;border-radius:9px;min-height:40px;font-family:var(--display);font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;font-size:14px}
.seg button.on{background:var(--silver);color:var(--night)}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:560px){.shop{grid-template-columns:1fr 1fr 1fr}}
.item{border:1px solid var(--line);background:linear-gradient(180deg,rgba(20,40,140,.55),rgba(11,26,92,.7));border-radius:16px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;color:var(--silver);min-height:140px}
.item .n{font-family:var(--display);font-weight:800;font-size:18px;color:#fff;line-height:1.05;letter-spacing:.03em}
.item .d{font-size:12.5px;color:var(--muted);line-height:1.35;flex:1}
.item .p{font-family:var(--display);font-weight:800;font-size:20px;color:var(--gold)}
.item.no .p{color:var(--muted)}
.board .li .rk{width:24px;font-family:var(--display);font-weight:800;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;background:var(--silver);color:var(--night);padding:12px 16px;border-radius:12px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px)}
.toast.bad{background:var(--red);color:#fff}
.hero{padding:22px 0 6px}
.hero h1{font-size:40px;font-weight:800;line-height:.95;letter-spacing:.04em;background:linear-gradient(180deg,#fff,#aab6d8);-webkit-background-clip:text;background-clip:text;color:transparent}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{color:var(--muted);font-weight:600;font-size:12px}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
details.ad{border:1px solid var(--line);border-radius:14px;margin:0 0 10px;background:rgba(11,26,92,.5)}
details.ad>summary{list-style:none;padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:8px}
details.ad>summary::-webkit-details-marker{display:none}
details.ad>div{padding:0 14px 14px}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;margin:40px auto}
@media (max-width:440px){.brand{font-size:15px;letter-spacing:.08em}.brand small{display:none}.mclink{padding:6px 8px;font-size:12px;letter-spacing:.08em}.bal{font-size:18px}.top .wrap{gap:8px}}
@keyframes sp{to{transform:rotate(360deg)}}
.wheel{width:220px;height:220px;margin:10px auto;border-radius:50%;position:relative;border:4px solid var(--gold);transition:transform 3.2s cubic-bezier(.17,.67,.2,1)}
.wptr{width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:20px solid var(--gold);margin:0 auto -6px;position:relative;z-index:2}
@media (prefers-reduced-motion:reduce){.wheel{transition:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="./">THE GAUNTLET<small>GP · SEASON 2026</small></a>
  <a class="mclink" href="./">MATCH CENTRE</a>
  <div class="bal" id="bal" hidden><span class="coin">GP</span><span id="balv">0</span></div>
</div></header>
<main class="wrap" id="main"><div class="spinner"></div></main>
<nav class="tabs" id="tabs" hidden><div class="wrap" id="tabsw"></div></nav>
<div id="layer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
'use strict';
/* ================================================================ constants */
const TZ = 'Asia/Beirut';
const FACE = { 1:'bigh', 2:'bahaa', 3:'jingo', 4:'alain', 5:'hassan', 6:'walid', 7:'sadek', 8:'nid', 9:'tarek', 10:'amin' };
const PW = {
  odds_boost:   { n:'Odds Boost', ic:'+.5', d:'Adds +0.5 to your decimal odds.' },
  insurance:    { n:'Bet Insurance', ic:'⛨', d:'Costs 5% of your stake. Lose, and you get 35% of your stake back.' },
  double_profit:{ n:'Double Profit', ic:'×2', d:'Doubles your net profit if you win.' },
  exact_score:  { n:'Exact Score', ic:'3–?', d:'Call the exact best-of-5 score. Admin sets the odds; pays stake × odds × 5, capped at 5× your stake.' },
  all_in:       { n:'All-In Bonus', ic:'ALL', d:'Stake exactly 50% of your balance (from when you opened this match). Win, and get extra profit up to your stake.' },
  underdog:     { n:'Underdog Challenge', ic:'UD', d:'Back the underdog. If they win, your total payout doubles.' },
  free_stake:   { n:'Free Stake', ic:'FREE', d:'Bet 10% of your balance for free. Win, and you keep the profit. Lose, and you lose nothing.' },
};
const KIND = { initial:'Starting balance', bet_stake:'Bet placed', payout:'Bet won', bonus:'Bonus', insurance_fee:'Insurance fee',
  insurance_recovery:'Insurance payout', free_stake_profit:'Free Stake profit', shop_purchase:'Shop', dn_wager:'Double or Nothing wager',
  dn_win:'Double or Nothing win', dn_refund:'Double or Nothing refund', hail_mary:'Hail Mary', refund:'Refund', admin_adjustment:'Admin adjustment' };
const ICON = {
  play:'<path d="M4 6h16M4 12h16M4 18h10"/><circle cx="19" cy="18" r="2"/>',
  shop:'<path d="M4 8h16l-1.5 11h-13z"/><path d="M9 8V6a3 3 0 016 0v2"/>',
  hist:'<path d="M3 12a9 9 0 109-9 9 9 0 00-7 3.3"/><path d="M3 4v4h4M12 7v5l3 2"/>',
  board:'<path d="M8 21V11M12 21V5M16 21v-7M4 21h16"/>',
  admin:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
};

/* ================================================================ data layer */
const cfg = window.GP_CONFIG || {};
const sb = window.GP_MOCK || (window.supabase && cfg.url && !cfg.url.includes('YOUR-') ? window.supabase.createClient(cfg.url, cfg.anonKey) : null);
const S = { me:null, players:[], matches:[], bets:[], ledger:[], items:[], purchases:[], hail:null, tab:'play', hist:'bets', admin:null };
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const r1 = (x) => Math.round((x + Number.EPSILON) * 10) / 10;
const gp = (x) => { const v = r1(Number(x)); return (Number.isInteger(v) ? v : v.toFixed(1)); };
const sgn = (x) => (x > 0 ? '+' : x < 0 ? '−' : '') + gp(Math.abs(x));
const P = (id) => S.players.find((p) => p.id === id) || { name:'?', id };
const face = (id, size = 40) => `<img class="face" src="faces/${FACE[id] || 'x'}.jpg" width="${size}" height="${size}" style="width:${size}px;height:${size}px" alt="">`;
const fmt = (d, o) => new Intl.DateTimeFormat('en-GB', { timeZone: TZ, ...o }).format(new Date(d));
const when = (d) => fmt(d, { weekday:'short', day:'numeric', month:'short' }) + ' · ' + fmt(d, { hour:'2-digit', minute:'2-digit', hour12:false });
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
function until(d) {
  const ms = new Date(d) - Date.now(); if (ms <= 0) return 'now';
  const h = Math.floor(ms / 3.6e6), m = Math.floor(ms % 3.6e6 / 6e4);
  return h >= 48 ? Math.floor(h / 24) + ' days' : h >= 1 ? `${h}h ${m}m` : `${m}m`;
}
async function q(p) { const { data, error } = await p; if (error) throw new Error(cleanErr(error.message)); return data; }
const cleanErr = (m) => String(m || 'Something went wrong').replace(/^.*?ERROR:\s*/, '');
const rpc = (fn, args) => q(sb.rpc(fn, args));

async function load() {
  S.me = await rpc('whoami');
  if (!S.me) return false;
  const id = S.me.id;
  const [players, matches, bets, ledger, items, purchases, hail] = await Promise.all([
    q(sb.from('v_leaderboard').select('*').order('balance', { ascending:false })),
    q(sb.from('v_matches').select('*').order('kickoff')),
    q(sb.from('bets').select('*').eq('player_id', id).order('id', { ascending:false })),
    q(sb.from('ledger').select('*').eq('player_id', id).order('id', { ascending:false })),
    q(sb.from('shop_items').select('*').order('sort')),
    q(sb.from('purchases').select('*').or(`player_id.eq.${id},target_id.eq.${id}`).order('id', { ascending:false })),
    q(sb.from('hail_mary').select('*').eq('player_id', id)),
  ]);
  Object.assign(S, { players, matches, bets, ledger, items, purchases, hail: hail[0] || null });
  return true;
}
async function loadAdmin() {
  const [bets, purchases, hail, ledger, log, players] = await Promise.all([
    q(sb.from('bets').select('*').order('id', { ascending:false })),
    q(sb.from('purchases').select('*').order('id', { ascending:false })),
    q(sb.from('hail_mary').select('*')),
    q(sb.from('ledger').select('*').order('id', { ascending:false }).limit(300)),
    q(sb.from('admin_log').select('*').order('id', { ascending:false }).limit(100)),
    q(sb.from('players').select('id,name,auth_uid,claimed_at,balance,streak,hail_mary_used,wa_admin').order('id')),
  ]);
  S.admin = { bets, purchases, hail, ledger, log, players };
}
async function refresh() { await load(); if (S.tab === 'admin') await loadAdmin(); render(); }

/* ================================================================ payout estimate (mirrors the server) */
function estimate(m, pick, stake, pw, streak) {
  const o = Number(pick === m.p1 ? m.p1_odds : m.p2_odds);
  const s = stake, N = s * o, n = N - s, k = streak + 1, sb_ = 0.5 * (k - 1) * n;
  let raw = N;
  if (pw === 'odds_boost') raw = s * (o + 0.5);
  if (pw === 'double_profit') raw = N + n;
  if (pw === 'underdog') raw = 2 * N;
  if (pw === 'all_in') raw = N + Math.min(n, s);
  if (pw === 'exact_score') raw = 5 * s;               // odds >= 1 x 5 always reaches the 5x cap
  const cap = 5 * s, total = r1(Math.min(raw + sb_, cap));
  return { o, total, capped: raw + sb_ > cap, streakBonus: r1(sb_), k, profit: r1(total - s) };
}

/* ================================================================ rendering */
function toast(msg, bad) {
  const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.textContent = msg; t.setAttribute('role', 'status');
  document.body.appendChild(t); setTimeout(() => t.remove(), bad ? 4200 : 2600);
}
function sheet(html) { $('#layer').innerHTML = `<div class="scrim" data-a="close"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`; }
function closeSheet() { $('#layer').innerHTML = ''; }

function render() {
  const main = $('#main');
  if (!S.me) return;
  $('#bal').hidden = false; $('#balv').textContent = gp(S.me.balance);
  const tabs = [['play','Bet','play'],['shop','Shop','shop'],['hist','History','hist'],['board','Table','board']];
  if (S.me.is_admin) tabs.push(['admin','Admin','admin']);
  $('#tabs').hidden = false;

  const fav = Math.max(m.p1_pct, m.p2_pct);
  let status = '';
  if (m.status === 'settled') status = `<span class="pill dim">FT · ${esc(P(m.winner).name)} 3–${m.loser_games}</span>`;
  else if (m.status === 'void') status = '<span class="pill red">VOID</span>';
  else if (m.betting_open) status = `<span class="pill">Locks in ${until(m.kickoff)}</span>`;
  else status = '<span class="pill dim">Betting closed</span>';
  const pws = m.powerups ? m.powerups.map((p) => `<span class="pill gold">⚡ ${PW[p].n}</span>`).join('') :

      : `<div class="empty">${m.powerups ? 'No power-up for this match.' : `This match's power-up is revealed 1 hour before kick-off (in ${until(m.reveal_at)}). Bet now without it, or come back for the reveal and watch live on Discord.`}</div>`}

async function lockBet() {

  if (B.pw === 'all_in') stake = Number(snap.all_in_stake);

/* ================================================================ auth screens */
let AUTH = { mode:'in', err:'', busy:false };
function viewAuth() {
  $('#tabs').hidden = true; $('#bal').hidden = true;
  const ready = !!sb;
  $('#main').innerHTML = `<div class="hero" style="padding-top:40px"><div class="kick">Gauntlet GP · Season 2026</div><h1>Bet. Boost.<br>Brag.</h1><p class="muted" style="margin:10px 0 0">50 GP each. Bet on every match, use match-day power-ups, buy chaos in the shop.</p></div>
    ${!ready ? '<div class="card red">This site is not connected to its database yet (config.js).</div>' : ''}
    <div class="card" style="margin-top:16px"><div class="seg"><button class="${AUTH.mode === 'in' ? 'on' : ''}" data-a="amode" data-v="in">Sign in</button><button class="${AUTH.mode === 'up' ? 'on' : ''}" data-a="amode" data-v="up">First time</button></div>
    <form id="authf" autocomplete="on">
      ${AUTH.mode === 'up' ? '<label class="f" for="code">Your invite code (from Amin)</label><input class="in" id="code" autocapitalize="characters" autocomplete="off" required placeholder="10 letters/numbers">' : ''}
      <label class="f" for="em">Email</label><input class="in" id="em" type="email" autocomplete="email" required>
      <label class="f" for="pw">Password${AUTH.mode === 'up' ? ' (choose one, 8+ characters)' : ''}</label><input class="in" id="pw" type="password" autocomplete="${AUTH.mode === 'up' ? 'new-password' : 'current-password'}" minlength="${AUTH.mode === 'up' ? 8 : 1}" required>
      <div class="err">${esc(AUTH.err)}</div>
      <button class="btn gold block" type="submit" ${AUTH.busy || !ready ? 'disabled' : ''}>${AUTH.busy ? 'One sec…' : AUTH.mode === 'up' ? 'Create my account' : 'Sign in'}</button>
    </form></div>
    <p class="small muted" style="text-align:center">Forgot your password? Ask Amin to unlink your account, then use “First time” again with your invite code.</p>`;
  $('#authf').addEventListener('submit', authSubmit);
}
async function authSubmit(ev) {
  ev.preventDefault();
  const email = $('#em').value.trim(), password = $('#pw').value, code = $('#code')?.value.trim();
  AUTH.busy = true; AUTH.err = ''; viewAuth(); $('#em').value = email; $('#pw').value = password; if (code) $('#code').value = code;
  try {
    if (AUTH.mode === 'up') {
      let { data, error } = await sb.auth.signUp({ email, password });
      if (error && /already registered/i.test(error.message)) ({ data, error } = await sb.auth.signInWithPassword({ email, password }));
      if (error) throw error;
      if (!data.session) throw new Error('Account created, but email confirmation is switched on. Ask Amin to turn off "Confirm email" in Supabase.');
      const name = await rpc('claim_player', { p_code: code });
      toast(`Welcome, ${name}!`);
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
    }
    await boot();
  } catch (e) {
    AUTH.busy = false; AUTH.err = cleanErr(e.message); viewAuth(); $('#em').value = email; if (code && $('#code')) $('#code').value = code;
  }
}
async function boot() {
  if (!sb) return viewAuth();
  const { data } = await sb.auth.getSession();
  if (!data.session) return viewAuth();
  try {
    if (!(await load())) { AUTH = { mode:'up', err:'Your login is not linked to a player yet. Enter your invite code.', busy:false }; return viewAuth(); }
    render();
  } catch (e) { $('#main').innerHTML = `<div class="card red" style="margin-top:20px">${esc(e.message)}</div><button class="btn" data-a="logout">Sign out</button>`; }
}

/* ================================================================ events */
document.addEventListener('click', async (ev) => {
  const el = ev.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, v = el.dataset.v;
  if (a === 'close') { if (ev.target === el || el.classList.contains('x') || el.tagName === 'BUTTON') closeSheet(); return; }
  const run = async (fn, ok) => { el.disabled = true; try { await fn(); if (ok) toast(ok); await refresh(); } catch (e) { toast(e.message, true); el.disabled = false; } };
  switch (a) {
    case 'tab': S.tab = v; window.scrollTo(0, 0); render(); if (v === 'admin') { S.admin = null; render(); } break;
    case 'shoptab': S.tab = 'shop'; render(); break;
    case 'hist': S.hist = v; render(); break;
    case 'amode': AUTH.mode = v; AUTH.err = ''; viewAuth(); break;
    case 'logout': await sb.auth.signOut(); location.reload(); break;
    case 'refresh': S.admin = null; await refresh(); break;
    case 'match': openMatch(Number(v)); break;
    case 'pick': B.pick = Number(v); B.confirm = false; B.err = ''; drawBet(); break;
    case 'pw': B.pw = v || null; B.confirm = false; B.err = ''; drawBet(); break;
    case 'lg': B.lg = Number(v); B.confirm = false; drawBet(); break;
    case 'pct': { const f = Number(v); B.stake = String(Math.floor(r1(Number(S.me.balance) * f) * 10) / 10); B.confirm = false; drawBet(); break; }
    case 'review': B.confirm = true; drawBet(); break;
    case 'lock': lockBet(); break;
    case 'item': openItem(Number(v)); break;
    case 'tgt': BUY.target = Number(v); drawBuy(); break;
    case 'buy': doBuy(); break;
    case 'dn': openDn(Number(v)); break;
    case 'dndecline': run(() => rpc('dn_respond', { p_purchase: Number(v), p_accept: false }), 'Challenge declined').then(closeSheet); break;
    case 'dnaccept': {
      const w = Math.floor(Number($('#dnw').value));
      el.disabled = true;
      try { await rpc('dn_respond', { p_purchase: Number(v), p_accept: true, p_wager: w }); closeSheet(); toast(`Accepted: ${w} GP each. Play it out!`); await refresh(); }
      catch (e) { $('#dnerr').textContent = e.message; el.disabled = false; }
      break; }
    case 'hail': run(() => rpc('request_hail_mary'), 'Sent to admin for confirmation'); break;
    // admin
    case 'msave': { const p = Number($('#pct' + v).value), ko = $('#ko' + v).value;
      run(() => rpc('admin_update_match', { p_match: Number(v), p_p1_pct: p, p_kickoff: ko ? beirutToIso(ko) : null }), 'Match updated'); break; }
    case 'mstatus': run(() => rpc('admin_update_match', { p_match: Number(v), p_status: el.dataset.s }), el.dataset.s === 'open' ? 'Betting reopened' : 'Betting closed'); break;
    case 'mreveal': run(() => rpc('admin_update_match', { p_match: Number(v), p_reveal: true }), 'Power-up revealed'); break;
    case 'exsave': run(() => rpc('admin_set_exact_odds', { p_bet: Number(v), p_odds: Number($('#ex' + v).value) }), 'Exact odds saved'); break;
    case 'msettle': { const w = Number($('#w' + v).value), lg = $('#lg' + v).value;
      if (!w || lg === '') return toast('Pick the winner and the score', true);
      if (!confirm(`Settle M${v}: ${P(w).name} wins 3–${lg}? This pays out every bet and can't be undone.`)) return;
      run(async () => { const r = await rpc('admin_settle_match', { p_match: Number(v), p_winner: w, p_loser_games: Number(lg) }); toast(`${r.bets_settled} bets settled · ${gp(r.gp_paid)} GP paid`); }); break; }
    case 'mvoid': { const why = prompt('Why is this match void? (refunds every stake and insurance fee)'); if (!why) return;
      run(() => rpc('admin_void_match', { p_match: Number(v), p_reason: why }), 'Match voided, stakes refunded'); break; }
    case 'pdone': run(() => rpc('admin_mark_purchase', { p_purchase: Number(v), p_status: 'fulfilled' }), 'Marked done'); break;
    case 'pcancel': { const why = prompt('Reason for cancelling (the buyer is refunded)'); if (!why) return;
      run(() => rpc('admin_mark_purchase', { p_purchase: Number(v), p_status: 'cancelled', p_note: why }), 'Cancelled and refunded'); break; }
    case 'dnwin': if (!confirm(`Confirm ${P(Number(el.dataset.w)).name} won the Rock, Paper, Scissors?`)) return;
      run(() => rpc('admin_dn_settle', { p_purchase: Number(v), p_winner: Number(el.dataset.w) }), 'Double or Nothing settled'); break;
    case 'dncancel': { const why = prompt('Reason for cancelling this challenge? (any held wagers go back)'); if (!why) return;
      const fee = confirm('Refund the buyer\'s fee too? OK = refund fee, Cancel = keep fee');
      run(() => rpc('admin_dn_cancel', { p_purchase: Number(v), p_refund_fee: fee, p_reason: why }), 'Challenge cancelled'); break; }
    case 'hmyes': if (!confirm(`Award ${P(Number(v)).name} 50 GP? Only do this after seeing the video.`)) return;
      run(() => rpc('admin_hail_mary', { p_player: Number(v), p_award: true, p_note: 'Video confirmed' }), 'Hail Mary awarded'); break;
    case 'hmno': { const why = prompt('Why reject? (they can try again)'); if (!why) return;
      run(() => rpc('admin_hail_mary', { p_player: Number(v), p_award: false, p_note: why }), 'Rejected'); break; }
    case 'adjust': { const p = Number($('#adjp').value), amt = Number($('#adja').value), why = $('#adjr').value.trim();
      if (!amt || !why) return toast('Enter an amount and a reason', true);
      if (!confirm(`${amt > 0 ? 'Give' : 'Take'} ${Math.abs(amt)} GP ${amt > 0 ? 'to' : 'from'} ${P(p).name}?`)) return;
      run(() => rpc('admin_adjust', { p_player: p, p_amount: amt, p_reason: why }), 'Adjustment posted'); break; }
    case 'unlink': if (!confirm(`Unlink ${P(Number(v)).name}'s login? They'll need their invite code to sign up again (their GP stays).`)) return;
      run(() => rpc('admin_unlink_player', { p_player: Number(v) }), 'Unlinked'); break;
  }
});

// Beirut wall-clock "YYYY-MM-DDTHH:MM" -> ISO, using Beirut's offset at that moment
function beirutToIso(local) {
  const guess = new Date(local + 'Z');
  const off = (d) => { const p = new Intl.DateTimeFormat('en-US', { timeZone: TZ, timeZoneName: 'shortOffset' }).formatToParts(d).find((x) => x.type === 'timeZoneName').value; const m = p.match(/GMT([+-]\d+)?(?::(\d+))?/); return ((Number(m[1]) || 0) * 60 + Math.sign(Number(m[1]) || 1) * (Number(m[2]) || 0)); };
  return new Date(guess.getTime() - off(guess) * 60000).toISOString();
}
