<title>Gauntlet Match Centre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: broadcast match centre. Fixture list -> match screen (scoreboard, phase stage, game log).
   Single deliberate night look, matching the Gauntlet draw page. */
:root{
  color-scheme:dark;
  --night:#030a2b; --deep:#06124a; --panel:rgba(12,28,98,.62); --card:#0f2170; --card2:#0b1a5c; --line:rgba(170,190,255,.2);
  --silver:#dfe6f5; --muted:#8f9cc7; --cyan:#3ad6ff; --gold:#e8c66a; --red:#ff5d6c; --green:#4ade80;
  --A:#3b6cf6; --B:#e2364c;
  --display:'Barlow Condensed','Arial Narrow',sans-serif; --body:'Barlow','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(1100px 600px at 50% -5%,#173aa8 0%,var(--deep) 45%,var(--night) 85%) fixed,var(--night);color:var(--silver);font-family:var(--body);font-size:15px}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:18px 48px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.38em;font-size:13px;color:var(--muted);text-transform:uppercase}
h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(34px,5.4vw,60px);line-height:.95;letter-spacing:.04em;text-transform:uppercase;
  background:linear-gradient(180deg,#fff,#dfe6f5 45%,#8e9cc0 55%,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:3px;padding:10px 16px;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase}
.btn:hover:not(:disabled){border-color:#fff}
.btn.main{background:linear-gradient(180deg,#fff,#c9d3ec);color:var(--deep);border:0;box-shadow:0 0 26px rgba(79,123,255,.45)}
.btn.gold{background:var(--gold);color:#241a00;border:0}
.btn:disabled{opacity:.35;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.h2{font-family:var(--display);font-weight:700;letter-spacing:.3em;font-size:14px;color:var(--muted);text-transform:uppercase;margin:0}
.face{border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.75)}

/* fixtures */
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
.week{background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.week h3{margin:0;padding:10px 14px;font-family:var(--display);font-weight:800;letter-spacing:.2em;font-size:16px;color:#fff;background:rgba(255,255,255,.07);display:flex;justify-content:space-between}
.week h3 small{color:var(--muted);font-weight:600;letter-spacing:.06em}
.fx{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 14px;background:none;border:0;border-top:1px solid var(--line);text-align:left}
.fx:hover{background:rgba(255,255,255,.06)}
.fx .g{font-family:var(--display);font-weight:800;font-size:12px;width:22px;height:22px;display:grid;place-items:center;border-radius:2px;color:#fff}
.fx .p{display:flex;align-items:center;gap:8px;min-width:0;font-family:var(--display);font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.03em}
.fx .p span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx .p.r{justify-content:flex-end;text-align:right}
.fx .mid{font-family:var(--display);font-weight:800;font-size:16px;color:var(--muted);min-width:44px;text-align:center}
.fx .mid.done{color:var(--gold)}
.fx .when{font-size:12px;color:var(--cyan);text-align:right;white-space:nowrap;line-height:1.3}
.fx .when span{display:block;color:var(--muted)}

/* match */
.score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px;padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:4px}
.side{display:flex;align-items:center;gap:16px;min-width:0}
.side.r{flex-direction:row-reverse;text-align:right}
.side .nm{font-family:var(--display);font-weight:800;font-size:clamp(20px,3vw,32px);letter-spacing:.04em;text-transform:uppercase;color:#fff;line-height:1}
.side .al{font-size:13px;color:var(--gold);font-style:italic;margin-top:4px}
.pips{display:flex;gap:6px;margin-top:10px}
.side.r .pips{justify-content:flex-end}
.pip{width:16px;height:16px;border-radius:50%;border:2px solid var(--line)}
.pip.on{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.big{font-family:var(--display);font-weight:800;font-size:clamp(40px,6vw,64px);text-align:center;color:#fff;line-height:1}
.big small{display:block;font-size:12px;letter-spacing:.24em;color:var(--muted);font-weight:600;margin-top:4px}
.stage{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:18px;min-width:0}
.prompt{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.08em;text-transform:uppercase;color:#fff;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.step{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:5px 10px;border:1px solid var(--line);border-radius:2px;color:var(--muted)}
.step.on{border-color:var(--cyan);color:var(--cyan)}
.step.done{color:var(--green);border-color:rgba(74,222,128,.4)}

.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.game{position:relative;display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:4px;border:1px solid var(--line);background:linear-gradient(160deg,color-mix(in srgb,var(--gc) 32%,#0b1a5c),#0b1a5c 70%);text-align:left;min-height:132px;transition:transform .12s,border-color .12s,opacity .3s}
.game svg{width:40px;height:40px;color:var(--gc);filter:drop-shadow(0 0 8px color-mix(in srgb,var(--gc) 60%,transparent))}
.game .t{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.04em;text-transform:uppercase;color:#fff;line-height:1.05}
.game .r{font-size:12px;color:var(--muted);line-height:1.35}
.game.pick:hover{transform:translateY(-2px);border-color:#fff}
.game.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.game.out{opacity:.32}
.game.out .t{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:3px}
.game.hot{border-color:#fff;box-shadow:0 0 0 2px #fff inset,0 0 24px color-mix(in srgb,var(--gc) 70%,transparent);transform:scale(1.03)}
.game:disabled{cursor:default}
.tag{position:absolute;top:8px;right:8px;font-family:var(--display);font-weight:700;font-size:10px;letter-spacing:.14em;padding:2px 6px;border-radius:2px;background:rgba(0,0,0,.4)}
.tag.v{color:var(--red)} .tag.p{color:var(--green)} .tag.n{color:var(--gold)}
.vetoby{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--red);font-weight:600}

.now{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;padding:16px;border-radius:4px;background:linear-gradient(120deg,color-mix(in srgb,var(--gc) 35%,#0b1a5c),#0b1a5c);border:1px solid var(--line);margin-bottom:16px}
.now svg{width:84px;height:84px;color:var(--gc);filter:drop-shadow(0 0 14px var(--gc))}
.now .k{font-family:var(--display);font-weight:700;letter-spacing:.24em;font-size:12px;color:var(--muted)}
.now .t{font-family:var(--display);font-weight:800;font-size:clamp(28px,4vw,42px);text-transform:uppercase;color:#fff;line-height:1}
.now .r{color:var(--silver);font-size:14px;margin-top:6px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.who button{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:4px;background:rgba(255,255,255,.04);font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.who button:hover{border-color:var(--gold);background:rgba(232,198,106,.12)}

.log{display:flex;flex-direction:column;gap:8px}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;background:var(--card2);border-radius:3px}
.li svg{width:24px;height:24px;color:var(--gc)}
.li .t{font-family:var(--display);font-weight:700;font-size:15px;text-transform:uppercase;color:#fff;letter-spacing:.03em}
.li .s{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px}

.result{text-align:center;padding:26px 16px;border-radius:4px;background:radial-gradient(500px 220px at 50% 0%,rgba(232,198,106,.28),transparent 70%),var(--card2);border:1px solid rgba(232,198,106,.5)}
.result .k{font-family:var(--display);font-weight:700;letter-spacing:.34em;font-size:13px;color:var(--gold)}
.result .w{font-family:var(--display);font-weight:800;font-size:clamp(34px,6vw,58px);text-transform:uppercase;color:#fff;margin:8px 0 2px;line-height:1}
.result .sc{font-family:var(--display);font-weight:800;font-size:28px;color:var(--gold)}
.tray{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:600}
.chip svg{width:16px;height:16px;color:var(--gc)}
textarea{width:100%;min-height:120px;background:rgba(3,10,43,.75);color:var(--silver);border:1px solid var(--line);border-radius:3px;padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--card);border:1px solid var(--gold);color:#fff;padding:10px 16px;border-radius:4px;font-weight:600;z-index:20}
.modal{position:fixed;inset:0;background:rgba(3,10,43,.75);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.modal[hidden]{display:none}
.modal .box{background:var(--deep);border:1px solid var(--line);padding:20px;max-width:400px;width:100%;display:flex;flex-direction:column;gap:14px}
@media (max-width:900px){.stage{grid-template-columns:1fr}}
@media (max-width:620px){.score{grid-template-columns:1fr;text-align:center}.side,.side.r{flex-direction:column;text-align:center}.side.r .pips,.pips{justify-content:center}.who{grid-template-columns:1fr}.weeks{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  <main id="app"></main>
</div>

  'Tarek Halabi': { k: 'tarek', g: 'B', alias: 'The Rager' },
  'Sadek Farhat': { k: 'sadek', g: 'B', alias: 'The Jido' },

const ICON = {
  chess: '<path d="M9 21h6M8 18h8l-1-4c2-1 3-3 2-6-1-2-3-3-5-3l-1-2-1 3-3 2 1 2 2-1c0 2-1 3-2 5z" />',

  shield: '<path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M12 7v10M8 11h8"/>',
  axe: '<path d="M14 4c3 0 6 3 6 6l-6 1-1-6z"/><path d="M13.5 6.5L4 20"/>',
  bolt: '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  ball: '<circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 4.5h-5L8 10z"/><path d="M12 3v4M16 10l4.5-1.5M14.5 14.5l3 3.5M9.5 14.5l-3 3.5M8 10L3.5 8.5"/>',
  cross: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/>',
  duck: '<path d="M8 10a4 4 0 117 2.5c3 0 5 1.5 6 3.5-2 3-5 4-9 4-4.5 0-7-2-7-5 0-1.5 1-2.5 2.5-3"/><path d="M15 9l3.5-.5"/><circle cx="11" cy="8.5" r=".6"/>',
  flag: '<path d="M5 21V3"/><path d="M5 4h13l-3 4 3 4H5"/><circle cx="11" cy="8" r="1.6"/>',
  worm: '<path d="M4 16c2-4 4-4 6 0s4 4 6 0 3-4 4-2"/><circle cx="19.5" cy="12.5" r="1.8"/>',
  wiki: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
  hook: '<path d="M12 3v9a4 4 0 11-4-4"/><path d="M8 8l-2-1 1 3"/><circle cx="12" cy="3" r="1"/>',
  flame: '<path d="M12 22c-4 0-7-3-7-7 0-4 3-6 4-10 2 2 3 4 3 6 1-1 2-2 2-4 3 3 5 5 5 8 0 4-3 7-7 7z"/><path d="M12 22c-2 0-3-1.5-3-3 0-2 2-3 3-5 1 2 3 3 3 5 0 1.5-1 3-3 3z"/>',
};
const GAMES = [
  { id: 'chess', name: 'Chess', rule: '10-minute rapid, one game', ic: 'chess', c: '#e2e8f0' },
  { id: 'lol', name: 'League of Legends', rule: '1v1 Howling Abyss · Bo3 · no repeat champs', ic: 'sword', c: '#3ad6ff' },
  { id: 'dota', name: 'Dota 2', rule: '1v1 mid · Bo3 · no repeat heroes', ic: 'shield', c: '#ff5d6c' },
  { id: 'wow', name: 'World of Warcraft', rule: 'PvP duel outside Orgrimmar', ic: 'axe', c: '#e8c66a' },
  { id: 'poke', name: 'Pokémon Showdown', rule: 'Bo3 Random Battles', ic: 'bolt', c: '#fde047' },
  { id: 'fifa', name: 'FIFA', rule: 'One game', ic: 'ball', c: '#4ade80' },
  { id: 'cs', name: 'Counter-Strike', rule: 'Dust II: AWP, Deagle, AK v M4', ic: 'cross', c: '#fb923c' },
  { id: 'duck', name: 'Duck Hunt', rule: 'Alternating hunter and prey', ic: 'duck', c: '#a3e635' },
  { id: 'op', name: 'One Piece Simulator', rule: '1v1 mirror match', ic: 'flag', c: '#e879f9' },
  { id: 'worms', name: 'Worms', rule: '1v1', ic: 'worm', c: '#f472b6' },
  { id: 'wiki', name: 'Wikipedia Races', rule: 'Same start and target article · fastest wins', ic: 'wiki', c: '#cbd5e1' },
  { id: 'pudge', name: 'Pudge Wars', rule: '1v1 custom game', ic: 'hook', c: '#84cc16' },
  { id: 'warlocks', name: 'Warlocks', rule: '1v1 custom game', ic: 'flame', c: '#f97316' },
];
const G = Object.fromEntries(GAMES.map((g) => [g.id, g]));
const FIX = [
  ['A','Week 1','Wed 14 Oct','00:00 · Tue night','Jingo','Big H@$#'],
  ['B','Week 1','Wed 14 Oct','12:00','Nid The Kid','Tarek Halabi'],
  ['A','Week 1','Thu 15 Oct','21:00','Bahaa Ayache','Hassan Bayloun'],
  ['B','Week 1','Sun 18 Oct','21:00','Sadek Farhat','Amin Ladki'],
  ['A','Week 2','Mon 19 Oct','18:00','Big H@$#','Bahaa Ayache'],
  ['A','Week 2','Wed 21 Oct','00:00 · Tue night','Hassan Bayloun','Jingo'],
  ['B','Week 2','Wed 21 Oct','21:00','Nid The Kid','Sadek Farhat'],
  ['B','Week 2','Sat 24 Oct','21:00','Amin Ladki','Walid Raouda'],
  ['B','Week 3','Wed 28 Oct','21:00','Amin Ladki','Nid The Kid'],
  ['B','Week 3','Sat 31 Oct','21:00','Walid Raouda','Tarek Halabi'],
  ['A','Week 3','Sat 31 Oct','21:00','Jingo','Bahaa Ayache'],
  ['A','Week 4','Wed 4 Nov','18:00','Hassan Bayloun','Big H@$#'],
  ['A','Week 4','Thu 5 Nov','21:00','Jingo','Alain Daher'],
  ['B','Week 4','Sat 7 Nov','12:00','Nid The Kid','Walid Raouda'],
  ['B','Week 4','Sun 8 Nov','21:00','Sadek Farhat','Tarek Halabi'],
  ['A','Week 5','Mon 9 Nov','21:00','Big H@$#','Alain Daher'],
  ['B','Week 5','Mon 9 Nov','21:00','Tarek Halabi','Amin Ladki'],
  ['A','Week 5','Thu 12 Nov','21:00','Alain Daher','Hassan Bayloun'],
  ['B','Week 5','Sat 14 Nov','21:00','Walid Raouda','Sadek Farhat'],
  ['A','Week 5','Sun 15 Nov','21:00','Bahaa Ayache','Alain Daher'],
].map(([g, wk, d, t, a, b], i) => ({ id: 'm' + i, g, wk, d, t, a, b }));
const WEEKS = { 'Week 1': '12 – 18 Oct', 'Week 2': '19 – 25 Oct', 'Week 3': '26 Oct – 1 Nov', 'Week 4': '2 – 8 Nov', 'Week 5': '9 – 15 Nov' };
const WIN = 3;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const face = (n, sz) => `<img class="face" src="${FACES[PLAYERS[n].k]}" alt="" width="${sz}" height="${sz}" style="width:${sz}px;height:${sz}px">`;
const icon = (id) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[G[id].ic]}</svg>`;
function rand(n) { const a = new Uint32Array(1), lim = Math.floor(0x100000000 / n) * n; do crypto.getRandomValues(a); while (a[0] >= lim); return a[0] % n; }
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

let S = { matches: {}, open: null };
try { const s = JSON.parse(localStorage.getItem('gauntlet-mc') || 'null'); if (s && s.matches) S = s; } catch (_) {}
const save = () => { try { localStorage.setItem('gauntlet-mc', JSON.stringify(S)); } catch (_) {} };
const blank = () => ({ neutral: [], vetoes: {}, games: [], current: null });
let hot = null, busy = false;

const fx = (id) => FIX.find((f) => f.id === id);
const st = (id) => S.matches[id] || (S.matches[id] = blank());
const wins = (m, p) => m.games.filter((g) => g.w === p).length;
const winner = (f, m) => (wins(m, f.a) >= WIN ? f.a : wins(m, f.b) >= WIN ? f.b : null);
function phase(f, m) {
  if (winner(f, m)) return 'done';
  if (m.neutral.length < 4) return 'pool';
  if (!m.vetoes[f.a]) return 'vetoA';
  if (!m.vetoes[f.b]) return 'vetoB';
  if (m.current) return 'play';
  if (!m.games.length) return 'spin';
  return 'pick';
}
const loser = (f, m) => { const l = m.games[m.games.length - 1]; return l.w === f.a ? f.b : f.a; };

function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }

/* ---------- fixtures view ---------- */
function viewFixtures() {
  $('#topbtns').innerHTML = '';
  const byWeek = {};
  FIX.forEach((f) => (byWeek[f.wk] = byWeek[f.wk] || []).push(f));
  return `<p class="h2" style="margin-bottom:12px">Pick a fixture to start match night</p><div class="weeks">${Object.entries(byWeek).map(([wk, list]) => `
    <section class="week"><h3>${wk.toUpperCase()} <small>${WEEKS[wk]}</small></h3>
    ${list.map((f) => { const m = S.matches[f.id]; const w = m && winner(f, m); const live = m && !w && (m.neutral.length || m.games.length);
      return `<button class="fx" data-a="open" data-v="${f.id}">
        <span class="g" style="background:var(--${f.g})">${f.g}</span>
        <span class="p r"><span>${esc(f.a)}</span>${face(f.a, 30)}</span>
        <span class="mid ${w ? 'done' : ''}">${m && (w || live) ? `${wins(m, f.a)}–${wins(m, f.b)}` : 'v'}</span>
        <span class="p">${face(f.b, 30)}<span>${esc(f.b)}</span></span>
        <span class="when">${esc(f.d)}<span>${w ? 'FINAL' : live ? 'LIVE' : esc(f.t)}</span></span></button>`; }).join('')}
    </section>`).join('')}</div>`;
}

/* ---------- match view ---------- */
function gameTile(id, opts = {}) {
  const g = G[id];
  const cls = ['game', opts.pick ? 'pick' : '', opts.sel ? 'sel' : '', opts.out ? 'out' : '', hot === id ? 'hot' : ''].join(' ');
  return `<button class="${cls}" style="--gc:${g.c}" ${opts.pick ? `data-a="${opts.action}" data-v="${id}"` : 'disabled'}>
    ${opts.tag ? `<span class="tag ${opts.tagc || ''}">${opts.tag}</span>` : ''}
    ${icon(id)}<span class="t">${esc(g.name)}</span><span class="r">${esc(g.rule)}</span>
    ${opts.by ? `<span class="vetoby">${face(opts.by, 18)} vetoed</span>` : ''}</button>`;
}
function viewMatch() {
  const f = fx(S.open), m = st(f.id), ph = phase(f, m), w = winner(f, m);
  $('#topbtns').innerHTML = `<button class="btn" data-a="back">← Fixtures</button><button class="btn" data-a="undo" ${busy || (!m.neutral.length) ? 'disabled' : ''}>Undo</button><button class="btn" data-a="reset" ${busy ? 'disabled' : ''}>Reset match</button>`;
  const pips = (p) => `<div class="pips">${Array.from({ length: WIN }, (_, i) => `<span class="pip ${i < wins(m, p) ? 'on' : ''}"></span>`).join('')}</div>`;
  const side = (p, r) => `<div class="side ${r ? 'r' : ''}">${face(p, 92)}<div><div class="nm">${esc(p)}</div><div class="al">“${esc(PLAYERS[p].alias)}”</div>${pips(p)}</div></div>`;
  const stepNames = [['pool', 'Neutral pool'], ['veto', 'Vetoes'], ['spin', 'Game 1 draw'], ['series', 'Best of 5']];
  const idx = { pool: 0, vetoA: 1, vetoB: 1, spin: 2, play: 3, pick: 3, done: 4 }[ph];
  const steps = `<div class="steps">${stepNames.map(([k, n], i) => `<span class="step ${i < idx ? 'done' : i === idx ? 'on' : ''}">${i + 1}. ${n}</span>`).join('')}</div>`;
  let main = '';
  if (ph === 'pool') {
    main = `<p class="prompt">Choose the 4 neutral games</p><p class="sub">Game 1 is drawn from these. Tap four games, or let the Commission draw them. ${m.neutral.length}/4 chosen.</p>
      <div class="row" style="margin-bottom:14px"><button class="btn main" data-a="rand4" ${busy ? 'disabled' : ''}>Draw 4 at random</button>${m.neutral.length ? '<button class="btn" data-a="clear4">Clear</button>' : ''}</div>
      <div class="games">${GAMES.map((g) => gameTile(g.id, { pick: !busy, action: 'tog', sel: m.neutral.includes(g.id), tag: m.neutral.includes(g.id) ? 'NEUTRAL' : '', tagc: 'n' })).join('')}</div>`;
  } else if (ph === 'vetoA' || ph === 'vetoB') {
    const p = ph === 'vetoA' ? f.a : f.b;
    main = `<p class="prompt"><span style="display:inline-flex;align-items:center;gap:10px">${face(p, 36)} ${esc(p)}, veto one game</span></p><p class="sub">Strike one of the four neutral games. It can't be game 1.</p>
      <div class="games">${m.neutral.map((id) => { const by = Object.keys(m.vetoes).find((k) => m.vetoes[k] === id); return gameTile(id, { pick: !by && !busy, action: 'veto', out: !!by, by, tag: by ? 'VETOED' : 'NEUTRAL', tagc: by ? 'v' : 'n' }); }).join('')}</div>`;
  } else if (ph === 'spin') {
    const left = m.neutral.filter((id) => !Object.values(m.vetoes).includes(id));
    main = `<p class="prompt">Game 1 · the draw</p><p class="sub">Two games survived the vetoes. One of them opens the series.</p>
      <div class="row" style="margin-bottom:14px"><button class="btn gold" data-a="spin" ${busy ? 'disabled' : ''}>Spin for game 1</button></div>
      <div class="games">${m.neutral.map((id) => { const by = Object.keys(m.vetoes).find((k) => m.vetoes[k] === id); return gameTile(id, { out: !!by, by, tag: by ? 'VETOED' : 'IN THE DRAW', tagc: by ? 'v' : 'n' }); }).join('')}</div>`;
  } else if (ph === 'play') {
    const g = G[m.current.id];
    main = `<div class="now" style="--gc:${g.c}">${icon(g.id)}<div><div class="k">GAME ${m.games.length + 1} · ${m.current.by === 'draw' ? 'DRAWN AT RANDOM' : 'PICKED BY ' + esc(m.current.by).toUpperCase()}</div><div class="t">${esc(g.name)}</div><div class="r">${esc(g.rule)}</div></div></div>
      <p class="prompt" style="font-size:16px">Who won?</p>
      <div class="who"><button data-a="won" data-v="a">${face(f.a, 44)} ${esc(f.a)}</button><button data-a="won" data-v="b">${face(f.b, 44)} ${esc(f.b)}</button></div>`;
  } else if (ph === 'pick') {
    const lo = loser(f, m), played = m.games.map((x) => x.id);
    main = `<p class="prompt"><span style="display:inline-flex;align-items:center;gap:10px">${face(lo, 36)} ${esc(lo)} picks game ${m.games.length + 1}</span></p><p class="sub">The loser of the last game chooses from the full pool. Games already played are out.</p>
      <div class="games">${GAMES.map((g) => { const p = played.includes(g.id); return gameTile(g.id, { pick: !p && !busy, action: 'pick', out: p, tag: p ? 'PLAYED' : '', tagc: 'p' }); }).join('')}</div>`;
  } else {
    const l = w === f.a ? f.b : f.a;
    main = `<div class="result"><div class="k">${f.g === 'A' ? 'GROUP A' : 'GROUP B'} · ${esc(f.d.toUpperCase())}</div>
      <div style="margin-top:14px">${face(w, 120)}</div>
      <div class="w">${esc(w)}</div><div class="sc">${wins(m, w)} – ${wins(m, l)}</div>
      <div style="color:var(--muted);margin-top:4px">defeats ${esc(l)}</div>
      <div class="tray">${m.games.map((x, i) => `<span class="chip" style="--gc:${G[x.id].c}">${icon(x.id)} G${i + 1} ${esc(G[x.id].name)} · ${esc(x.w.split(' ')[0])}</span>`).join('')}</div></div>
      <p class="h2" style="margin:18px 0 8px">Post to Discord</p><textarea id="out" readonly>${esc(resultText(f, m))}</textarea>
      <div class="row" style="margin-top:10px"><button class="btn main" data-a="copy">Copy result</button><button class="btn" data-a="back">Back to fixtures</button></div>`;
  }
  const vetoList = [f.a, f.b].map((p) => `<div class="li" style="--gc:${m.vetoes[p] ? G[m.vetoes[p]].c : 'var(--muted)'}">${face(p, 28)}<div><div class="t">${esc(p)}</div><div class="s">${m.vetoes[p] ? 'Vetoed ' + esc(G[m.vetoes[p]].name) : 'No veto yet'}</div></div>${m.vetoes[p] ? icon(m.vetoes[p]) : ''}</div>`).join('');
  const neutral = m.neutral.length ? `<div class="tray" style="justify-content:flex-start;margin-top:0">${m.neutral.map((id) => `<span class="chip" style="--gc:${G[id].c}">${icon(id)} ${esc(G[id].name)}</span>`).join('')}</div>` : '<div class="empty">Not chosen yet.</div>';
  const log = m.games.length ? m.games.map((x, i) => `<div class="li" style="--gc:${G[x.id].c}">${icon(x.id)}<div><div class="t">G${i + 1} · ${esc(G[x.id].name)}</div><div class="s">${x.by === 'draw' ? 'Random draw' : 'Pick: ' + esc(x.by)}</div></div>${face(x.w, 28)}</div>`).join('') : '<div class="empty">No games played yet.</div>';
  return `<section class="score">${side(f.a)}<div class="big">${wins(m, f.a)} – ${wins(m, f.b)}<small>BEST OF 5 · GROUP ${f.g}</small></div>${side(f.b, true)}</section>
    <section class="stage"><div class="panel">${steps}${main}</div>
      <div style="display:flex;flex-direction:column;gap:18px">
        <div class="panel"><p class="h2" style="margin-bottom:10px">Neutral pool</p>${neutral}</div>
        <div class="panel"><p class="h2" style="margin-bottom:10px">Vetoes</p><div class="log">${vetoList}</div></div>
        <div class="panel"><p class="h2" style="margin-bottom:10px">Series log</p><div class="log">${log}</div></div>
        <div class="panel" style="font-size:13px;color:var(--muted)">${esc(f.d)} · ${esc(f.t)} · Beirut time<br>Dates and times subject to change as per broadcasting rights.</div>
      </div></section>`;
}
function resultText(f, m) {
  const w = winner(f, m), l = w === f.a ? f.b : f.a;
  return [`**🏆 THE GAUNTLET · GROUP ${f.g} · ${f.d}**`, `**${w}** ${wins(m, w)}–${wins(m, l)} ${l}`, '',
    `Neutral pool: ${m.neutral.map((id) => G[id].name).join(', ')}`,
    `Vetoes: ${f.a} ✕ ${G[m.vetoes[f.a]].name} · ${f.b} ✕ ${G[m.vetoes[f.b]].name}`, '',
    ...m.games.map((x, i) => `G${i + 1} ${G[x.id].name} → ${x.w}${x.by === 'draw' ? ' (random)' : ` (pick: ${x.by})`}`)].join('\n');
}

function render() { $('#app').innerHTML = S.open ? viewMatch() : viewFixtures(); }

/* ---------- actions ---------- */
const A = {
  open(id) { S.open = id; save(); render(); scrollTo(0, 0); },
  back() { S.open = null; hot = null; save(); render(); },
  tog(id) { const m = st(S.open); const i = m.neutral.indexOf(id); if (i >= 0) m.neutral.splice(i, 1); else if (m.neutral.length < 4) m.neutral.push(id); else return toast('Four already chosen. Tap one to remove it.'); save(); render(); },
  clear4() { st(S.open).neutral = []; save(); render(); },
  async rand4() {
    const m = st(S.open); busy = true; m.neutral = [];
    const pool = GAMES.map((g) => g.id), pick = [];
    while (pick.length < 4) { const id = pool[rand(pool.length)]; if (!pick.includes(id)) pick.push(id); }
    for (const id of pick) {
      if (!reduced) for (let k = 0; k < 7; k++) { hot = pool[rand(pool.length)]; render(); await sleep(60 + k * 12); }
      hot = id; m.neutral.push(id); render(); await sleep(reduced ? 0 : 300);
    }
    hot = null; busy = false; save(); render();
  },
  veto(id) { const f = fx(S.open), m = st(f.id); const p = phase(f, m) === 'vetoA' ? f.a : f.b; m.vetoes[p] = id; save(); render(); },
  async spin() {
    const f = fx(S.open), m = st(f.id); const left = m.neutral.filter((id) => !Object.values(m.vetoes).includes(id));
    const pick = left[rand(left.length)]; busy = true;
    if (!reduced) { let d = 70; for (let k = 0; d < 420; k++) { hot = left[k % left.length]; render(); await sleep(d); d *= 1.14; } }
    hot = pick; render(); await sleep(reduced ? 0 : 900);
    hot = null; busy = false; m.current = { id: pick, by: 'draw' }; save(); render();
  },
  pick(id) { const f = fx(S.open), m = st(f.id); m.current = { id, by: loser(f, m) }; save(); render(); },
  won(side) { const f = fx(S.open), m = st(f.id); m.games.push({ id: m.current.id, w: side === 'a' ? f.a : f.b, by: m.current.by }); m.current = null; save(); render(); if (winner(f, m)) toast(`${winner(f, m)} wins the series`); },
  undo() { const f = fx(S.open), m = st(f.id);
    if (m.current) m.current = null; else if (m.games.length) { const g = m.games.pop(); if (g.by !== 'draw') m.current = { id: g.id, by: g.by }; else m.current = { id: g.id, by: 'draw' }; }
    else if (m.vetoes[f.b]) delete m.vetoes[f.b]; else if (m.vetoes[f.a]) delete m.vetoes[f.a]; else m.neutral.pop();
    save(); render(); },
  reset() { $('#mtext').textContent = 'Reset this match? The neutral pool, vetoes and results will be cleared.'; $('#modal').hidden = false; },
  async copy(_, btn) { const t = $('#out').value; try { await navigator.clipboard.writeText(t); toast('Copied. Paste it in Discord.'); } catch (_) { $('#out').select(); toast('Press Ctrl+C to copy'); } },
};
$('#mno').onclick = () => { $('#modal').hidden = true; };
$('#myes').onclick = () => { $('#modal').hidden = true; S.matches[S.open] = blank(); save(); render(); };
document.addEventListener('click', (e) => { const b = e.target.closest('[data-a]'); if (!b || b.disabled) return; const fn = A[b.dataset.a]; if (fn) fn(b.dataset.v, b); });

window.claude?.hot?.snapshot?.(() => S);
const boot = (d) => { if (d && d.matches) S = d; render(); };
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
